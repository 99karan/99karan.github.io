    <!-- colour theme: dark by default, light once chosen with the toggle (applied before first paint) -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('kp-theme'); } catch (e) {}
        var q = new URLSearchParams(location.search);
        if (t === 'light' && !q.has('drive') && !q.has('classic')) {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#f2eee6';
          document.querySelector('meta[name="color-scheme"]').content = 'light';
        }
      })();
    </script>
